<!DOCTYPE html>
<!-- Rebuilt local document viewer shell for the current application. -->
<html lang="en">
<head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="initial-scale=1.0, user-scalable=yes" />

    <title>DOCX Preview</title>
    <style>
        /* 1. 基础元素和通用容器的绝对重置 */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: auto; /* 允许滚动 */
            background-color: #ffffff;
            box-sizing: border-box;
        }

        #app {
            margin: 0;
            padding: 0;
            min-height: 100%;
            box-sizing: border-box;
        }

        /* 2. 移除所有元素的默认边距和内边距 */
        #app * {
            margin: 0 !important;
            padding: 0 !important;
            box-sizing: border-box !important;
        }

        /* 3. 针对 docx-preview 容器的精准修复 (清除 30px 冲突) */
        .docx-wrapper-wrapper,
        .docx,
        .docx-wrapper {
            /* 强制清除所有边距和内边距 */
            margin: 0 !important;
            padding: 0 !important;

            /* 保持 flex 布局，但移除冗余的 align-items */
            display: block !important;
            flex-flow: none !important;
            align-items: none !important;

            /* 强制定位到左上角 */
            left: 0 !important;
            top: 0 !important;

            /* 如果您想要背景，请在这里设置，而不是在第一个规则中 */
            background: transparent;
        }
    </style>

    <script type="module" crossorigin src="assets/doc.js"></script>
</head>
<body>
<div id="app"></div>
</body>
</html>
